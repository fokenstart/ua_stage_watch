name: Scrape stages

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Scraper et mettre à jour la base
        run: python main.py

      - name: Commit de data/jobs.json
        run: |
          git config --global user.name "stage-watcher-bot"
          git config --global user.email "actions@github.com"
          git add data/jobs.json
          git diff --quiet --cached || git commit -m "Update internship database"
          git push
